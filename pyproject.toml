[project]
name = "v2ex_daily_mission"
dynamic = ["version"]
description = "complete mission, get money, from v2ex"
readme = "README.rst"
license = { text = "MIT" }
authors = [{ name = "lord63", email = "lord63.j@gmail.com" }]
keywords = ["v2ex", "daily", "money", "sign"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "click>=5.0",
    "requests>=2.7.0",
    "beautifulsoup4>=4.4.1",
]

[project.urls]
Homepage = "https://github.com/lord63/v2ex_daily_mission"

[project.scripts]
v2ex = "v2ex_daily_mission.cli:cli"

[dependency-groups]
dev = [
    "pytest",
    "responses",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "v2ex_daily_mission/__init__.py"

[tool.pytest.ini_options]
addopts = "-vs"
